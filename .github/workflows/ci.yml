name: TraceX Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readiness-check:
    name: Production Security & Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Production Audit Scanner
        run: |
          python scripts/production_check.py

  frontend-build:
    name: Frontend Dashboard Build & Verification
    runs-on: ubuntu-latest
    needs: production-readiness-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dashboard
        run: |
          npm ci || npm install

      - name: Build Production Dashboard
        working-directory: dashboard
        run: |
          npm run build

      - name: Validate Production Build Artifacts
        run: |
          test -f dashboard/dist/index.html || { echo "Missing dashboard/dist/index.html"; exit 1; }
          echo "Frontend build successfully validated."

  backend-validation:
    name: Backend Syntax & Module Validation
    runs-on: ubuntu-latest
    needs: production-readiness-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax (AST Compilation)
        run: |
          python -m compileall backend/

      - name: Execute Backend Tests (If Database Secret Available)
        if: env.MONGODB_URI != ''
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-32-chars-long-minimum-random' }}
          ENVIRONMENT: test
        run: |
          python backend/test_suite.py

  android-build-check:
    name: Android Forensic Client Build Check
    runs-on: ubuntu-latest
    needs: production-readiness-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper Permissions
        working-directory: android
        run: |
          chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracex-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
